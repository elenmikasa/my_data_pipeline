main:
  steps:
    - logStart:
        call: sys.log
        args:
          text: "電力データETLパイプライン（Fetcher & Transformer）を開始します"

    # 1. Fetcherジョブを実行し、完了を待つ
    - runFetcher:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${ "namespaces/" + sys.get_env("PROJECT_ID") + "/jobs/power-csv-fetcher-job" }
          location: ${ sys.get_env("REGION") }
        result: fetcherResult

    # 2. Transformerジョブを実行し、完了を待つ
    - runTransformer:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${ "namespaces/" + sys.get_env("PROJECT_ID") + "/jobs/power-csv-transformer-job" }
          location: ${ sys.get_env("REGION") }
        result: transformerResult

    - logEnd:
        call: sys.log
        args:
          text: "電力データETLパイプラインが正常に完了しました"